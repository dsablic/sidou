name: image-tools
description: >-
  cargo-nextest, rustfmt and clippy for a build image published before tools/docker/Dockerfile
  carried them; a no-op in an image that has them. Remove once image.digest names such an image.
runs:
  using: composite
  steps:
    - name: rustfmt and clippy
      shell: bash
      run: rustup component list --installed | grep -q '^clippy' || rustup component add rustfmt clippy
    - name: cargo-nextest
      shell: bash
      run: |
        command -v cargo-nextest >/dev/null && exit 0
        version=$(sed -n 's/^ARG NEXTEST_VERSION=//p' tools/docker/Dockerfile)
        sha=$(sed -n 's/^ARG NEXTEST_SHA256=//p' tools/docker/Dockerfile)
        curl -fsSL --retry 3 -o /tmp/nextest.tar.gz \
          "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$version/cargo-nextest-$version-x86_64-unknown-linux-gnu.tar.gz"
        echo "$sha  /tmp/nextest.tar.gz" | sha256sum -c -
        tar -xzf /tmp/nextest.tar.gz -C "$CARGO_HOME/bin"
