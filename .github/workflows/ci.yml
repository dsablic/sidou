name: ci
# Only on a release tag (v1.2.3) or when started by hand (Actions, Run workflow).
#
# The in-depth testing happens before a change merges: every merge passes the full local check
# (both firmware builds, fmt, clippy, the workspace tests, UBSan, the packager, the whole
# emulator gate, REUSE, the GCC check, the browser demo; TESTING.md). CI adds only what that
# check cannot: the release package built clean from the tag on Linux, and booted in fm1-emu.
# One job, in the prebuilt build image (tools/docker, build-image.yml): nothing is installed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always

jobs:
  fm1:
    runs-on: ubuntu-24.04
    container:
      # Pinned by digest: the controller fills it in after build-image.yml publishes the image
      # (the same digest as tools/docker/image.digest).
      image: ghcr.io/dsablic/sidou-build@sha256:87b5c3b71bb96bf90be42e0de67be7510e07668389ed1c6b1de9ecc260f9ce7c
    env:
      # A release tag builds SIDOU's own identity, FM-1_964 (docs/TODO.md); anything else the
      # development one, FM-1_900.
      SIDOU_PRODUCT: ${{ startsWith(github.ref, 'refs/tags/v') && 'FM-1_964' || 'FM-1_900' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # tools/fm1-docker sees it is inside the image and runs the toolchain directly.
      - name: Configure
        run: tools/fm1-docker cmake --preset fm1 -DSIDOU_PRODUCT=${SIDOU_PRODUCT}
      - name: Build
        run: tools/fm1-docker cmake --build --preset fm1
      # The package's inputs that are not ours (three AC79 SDK files), pinned by SHA-256 in
      # inputs.toml: cached, so a run need not reach gitee; sidou-pack downloads and checks them
      # on a miss.
      - uses: actions/cache@v4
        with:
          path: build/ac79
          key: sidou-pack-inputs-${{ hashFiles('host/crates/sidou-pack/inputs.toml') }}
      - name: Package sidou.fwsc
        working-directory: host
        run: >-
          cargo run --locked --release -p sidou-pack --
          --product ${SIDOU_PRODUCT}
          --app ../build/fm1/platform/fm1/sidou_app.bin
          --loader ../build/fm1/platform/fm1/loader/loader.bin
          -o ../build/fm1/sidou.fwsc
      - name: The package boots in fm1-emu
        working-directory: host
        env:
          SIDOU_FM1_BUILD: ${{ github.workspace }}/build/fm1
        run: cargo test --locked --release -p emu-gate --test package -- --nocapture
      - name: Check the boot test actually ran
        # Without SIDOU_FM1_BUILD the gate skips and passes; the report proves it ran.
        run: |
          f=build/fm1/sidou_package.json
          test -s "$f" || { echo "::error::$f missing: the package boot test did not run"; exit 1; }
          jq -e '.first_difference_from_bare_image == null' "$f"
      - name: The package's SHA-256
        run: sha256sum build/fm1/sidou.fwsc | tee -a "$GITHUB_STEP_SUMMARY"
      # The package, with the licence of the AC79 SDK files in it (and SIDOU's).
      - uses: actions/upload-artifact@v4
        with:
          name: sidou-fwsc
          path: |
            build/fm1/sidou.fwsc
            LICENSES/Apache-2.0.txt
            LICENSES/GPL-3.0-only.txt
          if-no-files-found: error
