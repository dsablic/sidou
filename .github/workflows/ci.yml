name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install libclang (bindgen)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev clang
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Tests (emulator gate skips itself without SIDOU_FM1_BUILD)
        run: cargo test --locked --workspace --release
      - name: Tests with UBSan on the C/C++ code
        env:
          SIDOU_SANITIZE: undefined
        run: cargo test --locked --workspace

  asan:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: host
    env:
      # One compiler family for the instrumented C/C++ objects and the ASan runtime Rust links.
      CC: clang
      CXX: clang++
      SIDOU_SANITIZE: address
      RUSTFLAGS: -Zsanitizer=address
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install clang and libclang
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev clang
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      - run: cargo +nightly test --locked --workspace -Zbuild-std --target x86_64-unknown-linux-gnu

  msrv:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install libclang (bindgen)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev clang
      - uses: dtolnay/rust-toolchain@1.87
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      - run: cargo check --locked --workspace --all-targets

  reuse:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5

  fm1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install libclang (bindgen)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev clang
      - name: Configure (pinned pi32v2 toolchain in Docker)
        run: tools/fm1-docker cmake --preset fm1
      - name: Build
        run: tools/fm1-docker cmake --build --preset fm1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      # The package's inputs that are not ours (three AC79 SDK files), pinned by SHA-256 in
      # inputs.toml: cached, so a run need not reach gitee; sidou-pack downloads and checks them
      # on a miss.
      - uses: actions/cache@v4
        with:
          path: build/ac79
          key: sidou-pack-inputs-${{ hashFiles('host/crates/sidou-pack/inputs.toml') }}
      # M-VAVE's official V15 package, for the packager's stock-return tests only (it never goes
      # into a package): the SHA-256 Felucca's installer pins.
      - uses: actions/cache@v4
        with:
          path: build/stock
          key: fm1-stock-v15-db1642b2
      - name: Fetch the V15 package for the tests
        run: |
          f=build/stock/FM-1.fwsc
          sum=db1642b2b6fa5c2cccb11ffd13878068bb28601678d3644049f99dc40e7edb8a
          if ! echo "$sum  $f" | sha256sum -c --status 2>/dev/null; then
            mkdir -p build/stock
            curl -sSfL --retry 3 --connect-timeout 20 --max-time 300 -o "$f" \
              https://yms-file-store.oss-cn-hongkong.aliyuncs.com/software/firmware/FM-1.fwsc
            echo "$sum  $f" | sha256sum -c
          fi
      - name: Package sidou.fwsc
        working-directory: host
        run: >-
          cargo run --locked --release -p sidou-pack --
          --app ../build/fm1/platform/fm1/sidou_app.bin
          --loader ../build/fm1/platform/fm1/loader/loader.bin
          -o ../build/fm1/sidou.fwsc
      - name: Packager tests (with the inputs and the V15 package)
        working-directory: host
        run: cargo test --locked --release -p sidou-pack -- --nocapture
      - name: Emulator gate, boot, live, MIDI, SRAM, boot-guard and package tests
        working-directory: host
        env:
          SIDOU_FM1_BUILD: ${{ github.workspace }}/build/fm1
        run: cargo test --locked --release -p emu-gate -- --nocapture --test-threads=1
      - name: Check the gate actually ran
        # Without SIDOU_FM1_BUILD the gate skips and passes; the reports prove it ran.
        run: |
          for n in 1 2; do
            f=build/fm1/sid_budget_$n.json
            test -s "$f" || { echo "::error::$f missing: the emulator gate did not run"; exit 1; }
            jq -e '.instructions_per_sample | numbers' "$f"
          done
          f=build/fm1/sidou_boot.json
          test -s "$f" || { echo "::error::$f missing: the boot test did not run"; exit 1; }
          jq -e '.f0_hz | numbers' "$f"
          f=build/fm1/sidou_package.json
          test -s "$f" || { echo "::error::$f missing: the package boot test did not run"; exit 1; }
          jq -e '.first_difference_from_bare_image == null' "$f"
          for n in 1 2; do
            f=build/fm1/fx_budget_$n.json
            test -s "$f" || { echo "::error::$f missing: the effects gate did not run"; exit 1; }
            jq -e '.fx_instructions_per_sample | numbers' "$f"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sid-budget
          path: |
            build/fm1/sid_budget_*.json
            build/fm1/sidou_boot.json
            build/fm1/sidou_package.json
            build/fm1/fx_budget_*.json
          if-no-files-found: warn
      # The package, with the licence of the AC79 SDK files in it (and SIDOU's).
      - uses: actions/upload-artifact@v4
        with:
          name: sidou-fwsc
          path: |
            build/fm1/sidou.fwsc
            build/fm1/sidou_package.wav
            LICENSES/Apache-2.0.txt
            LICENSES/GPL-3.0-only.txt
          if-no-files-found: error
