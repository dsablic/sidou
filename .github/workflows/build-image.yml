name: build-image
# Builds and publishes the build image (tools/docker/Dockerfile) that ci.yml and
# tools/fm1-docker run in: ghcr.io/dsablic/sidou-build, :latest and :<commit>.
# When the digest changes, put it in tools/docker/image.digest and in ci.yml.
on:
  push:
    branches: [main]
    paths: ['tools/docker/**', '.github/workflows/build-image.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: toolchain
        run: echo "sha256=$(cat tools/docker/toolchain.sha256)" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: tools/docker
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: TOOLCHAIN_SHA256=${{ steps.toolchain.outputs.sha256 }}
          tags: |
            ghcr.io/dsablic/sidou-build:latest
            ghcr.io/dsablic/sidou-build:${{ github.sha }}
      - name: The pushed digest
        run: |
          {
            echo "ghcr.io/dsablic/sidou-build@${{ steps.build.outputs.digest }}"
            echo
            echo 'Put it in tools/docker/image.digest and in .github/workflows/ci.yml.'
          } | tee -a "$GITHUB_STEP_SUMMARY"
