# The browser demo on GitHub Pages: tools/web-demo builds the site (the firmware, its package,
# fm1-emu's web frontend at the pinned revision) and smoke-tests it in headless Chromium;
# only a build that passes is deployed. Pages must be enabled with "GitHub Actions" as its
# source (docs/TODO.md).
name: pages
# On every push to main that changes the firmware, the demo page or the README (the user,
# 2026-10-23: the demo stays in step with the README and the newest firmware), on a release tag,
# or by hand (Actions, Run workflow). The page names the build it runs (version.json).
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['app/**', 'core/**', 'platform/**', 'assets/**', 'web/**', 'README.md', 'CMakeLists.txt',
            'tools/web-demo', 'docs/media/videos/**', 'host/crates/emu-gate/Cargo.toml', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-24.04
    # The build image, as ci.yml (the same digest as tools/docker/image.digest): the toolchains,
    # Node and Playwright's Chromium are in it, so nothing is installed here.
    container:
      image: ghcr.io/dsablic/sidou-build@sha256:c5d6a1d204a635f2b698ade0f07deb5843e6e001d5f74684bbc92a5d974766cf
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            host
            build/fm1-emu -> target/wasm
      # sidou-pack's inputs (three AC79 SDK files), as in ci.yml
      - uses: actions/cache@v4
        with:
          path: build/ac79
          key: sidou-pack-inputs-${{ hashFiles('host/crates/sidou-pack/inputs.toml') }}
      - name: Build the site and smoke-test it (tools/web-demo --check)
        run: tools/web-demo --check
      # The videos: GitHub serves release assets only as downloads, so the release MP4s are
      # copied into the site, where web/videos.html plays them.
      - name: The videos from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/web/videos
          # From the newest release that has videos (a fix release may come without them).
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases?per_page=20" \
            | jq -r '[.[] | select(.draft | not) | select(any(.assets[]; .name | test("^video-.*\\.mp4$")))][0].assets[]
                     | select(.name | test("^video-.*\\.mp4$")) | "\(.name) \(.browser_download_url)"' \
            | while read -r name url; do curl -fsSL --retry 3 -o "build/web/videos/$name" "$url"; done
          ls build/web/videos | grep -c '^video-' || echo "no videos in the latest release"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-demo-screenshot
          path: build/web-check/screenshot.png
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
