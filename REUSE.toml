version = 1

[[annotations]]
path = ["docs/**"]
SPDX-FileCopyrightText = "2026 SIDOU contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = [".gitmodules", "CMakePresets.json", "compile_flags.txt", "host/Cargo.lock", "tests/golden/hashes.txt", "tests/golden/lcd/*.png", "tests/golden/scene/*", "tools/docker/toolchain.sha256", "web/firmwares.json"]
SPDX-FileCopyrightText = "2026 SIDOU contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# SIDOU's logos, Metal Chrome (the logo, and its title cards) and Cracktro Chrome (an
# alternative): original art made for SIDOU, exported from their sources,
# assets/logo/metal-chrome.js and assets/logo/cracktro-chrome.js (docs/art/README.md "Logo").
[[annotations]]
path = ["assets/logo/*.png", "docs/art/avatar.png"]
SPDX-FileCopyrightText = "2026 SIDOU contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# RED MOON RITE, SCENE's first vignette: original art made for SIDOU, and its motion tables,
# exported from its source, assets/scene/red-moon-rite.js (docs/art/README.md "RED MOON RITE").
[[annotations]]
path = ["assets/scene/*.png", "assets/scene/red-moon-rite-motion.txt"]
SPDX-FileCopyrightText = "2026 SIDOU contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# SIDOU's songs: original music written for SIDOU, the .sng files written out from their
# sources (assets/songs/<name>.md names each one's).
[[annotations]]
path = ["assets/songs/*.sng"]
SPDX-FileCopyrightText = "2026 SIDOU contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The look-and-feel prototypes (self-contained HTML pages made for SIDOU):
# reference art and code for M2's STEP/TRACKER views and SCENE pieces.
[[annotations]]
path = ["assets/prototypes/*.html"]
SPDX-FileCopyrightText = "2026 SIDOU contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Test data made by SIDOU's own tests: a format 1 store region and schema 1/2 settings
# (host/crates/sidou-tests/tests/app/store.rs and settings.rs).
[[annotations]]
path = [
    "host/crates/sidou-tests/tests/data/store-v1.bin",
    "host/crates/sidou-tests/tests/data/settings-v1.bin",
    "host/crates/sidou-tests/tests/data/settings-v2.bin",
]
SPDX-FileCopyrightText = "2026 SIDOU contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Test data only, never built into the firmware: the font8x8 face that SIDOU's
# own font is checked against (host/crates/sidou-tests/tests/app/font.rs).
[[annotations]]
path = ["host/crates/sidou-tests/tests/data/font8x8_basic.h"]
SPDX-FileCopyrightText = "Daniel Hepper <daniel@hepper.net>, after Marcel Sondaar and IBM's VGA fonts"
SPDX-License-Identifier = "LicenseRef-PublicDomain"

# GoatTracker 2.77, vendored unmodified for the song player's reference harness, test-only
# (third_party/goattracker2/VENDORED.md): its C sources and readme are GPL-2.0-or-later;
# its playroutines carry their own permissive notice; its example songs ship with it.
[[annotations]]
path = ["third_party/goattracker2/src/*.c", "third_party/goattracker2/src/*.h", "third_party/goattracker2/readme.txt", "third_party/goattracker2/copying"]
SPDX-FileCopyrightText = "Lasse Öörni and GoatTracker 2's contributors (readme.txt)"
SPDX-License-Identifier = "GPL-2.0-or-later"

[[annotations]]
path = ["third_party/goattracker2/src/player.s", "third_party/goattracker2/src/altplayer.s"]
SPDX-FileCopyrightText = "Lasse Öörni"
SPDX-License-Identifier = "LicenseRef-GoatTracker-Playroutine"

[[annotations]]
path = ["third_party/goattracker2/examples/*"]
SPDX-FileCopyrightText = "GoatTracker 2's example songs' authors: Cadaver (Lasse Öörni), Randall, Richard Bayliss, Hein, Jammer, No-XS after beek (examples/goatcompo.txt and each song's header)"
SPDX-License-Identifier = "GPL-2.0-or-later"

# Klaus Dormann's 6502 functional test, test data only (third_party/6502-tests/VENDORED.md).
[[annotations]]
path = ["third_party/6502-tests/6502_functional_test.bin", "third_party/6502-tests/6502_functional_test.lst"]
SPDX-FileCopyrightText = "2012-2015 Klaus Dormann"
SPDX-License-Identifier = "GPL-3.0-or-later"
