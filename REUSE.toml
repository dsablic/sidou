version = 1

[[annotations]]
path = ["docs/**"]
SPDX-FileCopyrightText = "2026 SIDOU contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = [".gitmodules", "CMakePresets.json", "compile_flags.txt", "host/Cargo.lock", "tests/golden/hashes.txt", "tests/golden/lcd/*.png", "tests/golden/scene/*", "tools/docker/toolchain.sha256", "web/firmwares.json"]
SPDX-FileCopyrightText = "2026 SIDOU contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# SIDOU's logos, Metal Chrome (the logo, and its title cards) and Cracktro Chrome (an
# alternative): original art made for SIDOU, exported from their sources,
# assets/logo/metal-chrome.js and assets/logo/cracktro-chrome.js (docs/art/README.md "Logo").
[[annotations]]
path = ["assets/logo/*.png", "docs/art/avatar.png"]
SPDX-FileCopyrightText = "2026 SIDOU contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# RED MOON RITE, SCENE's first vignette: original art made for SIDOU, and its motion tables,
# exported from its source, assets/scene/red-moon-rite.js (docs/art/README.md "RED MOON RITE").
[[annotations]]
path = ["assets/scene/*.png", "assets/scene/red-moon-rite-motion.txt"]
SPDX-FileCopyrightText = "2026 SIDOU contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# SIDOU's songs: original music written for SIDOU, the .sng files written out from their
# sources (assets/songs/<name>.md names each one's).
[[annotations]]
path = ["assets/songs/*.sng"]
SPDX-FileCopyrightText = "2026 SIDOU contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The gate runs of GoatTracker 2.77's packed player over SIDOU's songs and GoatTracker's examples,
# made by host/crates/gt2-ref/tests/midi_walk.rs for web/songmidi.test.mjs.
[[annotations]]
path = ["web/songmidi-fixtures/*.json"]
SPDX-FileCopyrightText = "2026 SIDOU contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# What the host build of SIDOU's song code makes of SIDOU's songs and GoatTracker's examples (and a
# few files embedded as hex), made by host/crates/sidou-tests/tests/web_core.rs for web/core.test.mjs.
[[annotations]]
path = ["web/core-fixtures.json"]
SPDX-FileCopyrightText = "2026 SIDOU contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The starter pack (assets/starter, LICENSING.md "The starter pack"): the .sid tunes, written by
# host/crates/sidou-tests/tests/starter.rs from the .sng in assets/songs (SIDOU's, GPL-3.0-or-later)
# and in third_party/goattracker2/examples (Cadaver's, GPL-2.0-or-later), each with
# GoatTracker's playroutine (LicenseRef-GoatTracker-Playroutine, "use it, or song binaries
# created from it freely for any purpose"). Each tune's .md names its licence.
[[annotations]]
path = ["assets/starter/chrome-comet.sid", "assets/starter/iron-rite.sid", "assets/starter/neon-highway.sid", "assets/starter/paper-lanterns.sid", "assets/starter/sidou-loop.sid"]
SPDX-FileCopyrightText = "2026 SIDOU contributors"
SPDX-License-Identifier = "GPL-3.0-or-later AND LicenseRef-GoatTracker-Playroutine"

[[annotations]]
path = ["assets/starter/sanction.sid", "assets/starter/consultant.sid", "assets/starter/dojo.sid", "assets/starter/transylvanian.sid", "assets/starter/unleash.sid", "assets/starter/2xtest.sid"]
SPDX-FileCopyrightText = ["Cadaver (Lasse Öörni): the song (its header and examples/goatcompo.txt)", "Lasse Öörni: the playroutine"]
SPDX-License-Identifier = "GPL-2.0-or-later AND LicenseRef-GoatTracker-Playroutine"

# The look-and-feel prototypes (self-contained HTML pages made for SIDOU):
# reference art and code for M2's STEP/TRACKER views and SCENE pieces.
[[annotations]]
path = ["assets/prototypes/*.html"]
SPDX-FileCopyrightText = "2026 SIDOU contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Test data made by SIDOU's own tests: a format 1 store region and schema 1–4 settings
# (host/crates/sidou-tests/tests/app/store.rs and settings.rs).
[[annotations]]
path = [
    "host/crates/sidou-tests/tests/data/store-v1.bin",
    "host/crates/sidou-tests/tests/data/settings-v1.bin",
    "host/crates/sidou-tests/tests/data/settings-v2.bin",
    "host/crates/sidou-tests/tests/data/settings-v3.bin",
    "host/crates/sidou-tests/tests/data/settings-v4.bin",
]
SPDX-FileCopyrightText = "2026 SIDOU contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Test data only, never built into the firmware: the font8x8 face that SIDOU's
# own font is checked against (host/crates/sidou-tests/tests/app/font.rs).
[[annotations]]
path = ["host/crates/sidou-tests/tests/data/font8x8_basic.h"]
SPDX-FileCopyrightText = "Daniel Hepper <daniel@hepper.net>, after Marcel Sondaar and IBM's VGA fonts"
SPDX-License-Identifier = "LicenseRef-PublicDomain"

# GoatTracker 2.77, vendored unmodified for the song player's reference harness, test-only
# (third_party/goattracker2/VENDORED.md): its C sources and readme are GPL-2.0-or-later;
# its playroutines carry their own permissive notice; its example songs ship with it.
[[annotations]]
path = ["third_party/goattracker2/src/*.c", "third_party/goattracker2/src/*.h", "third_party/goattracker2/readme.txt", "third_party/goattracker2/copying"]
SPDX-FileCopyrightText = "Lasse Öörni and GoatTracker 2's contributors (readme.txt)"
SPDX-License-Identifier = "GPL-2.0-or-later"

[[annotations]]
path = ["third_party/goattracker2/src/player.s", "third_party/goattracker2/src/altplayer.s"]
SPDX-FileCopyrightText = "Lasse Öörni"
SPDX-License-Identifier = "LicenseRef-GoatTracker-Playroutine"

[[annotations]]
path = ["third_party/goattracker2/examples/*"]
SPDX-FileCopyrightText = "GoatTracker 2's example songs' authors: Cadaver (Lasse Öörni), Randall, Richard Bayliss, Hein, Jammer, No-XS after beek (examples/goatcompo.txt and each song's header)"
SPDX-License-Identifier = "GPL-2.0-or-later"

# Klaus Dormann's 6502 functional test, test data only (third_party/6502-tests/VENDORED.md).
[[annotations]]
path = ["third_party/6502-tests/6502_functional_test.bin", "third_party/6502-tests/6502_functional_test.lst"]
SPDX-FileCopyrightText = "2012-2015 Klaus Dormann"
SPDX-License-Identifier = "GPL-3.0-or-later"

# A subset of Tom Harte's SingleStepTests (6502 v1), test data only, in SIDOU's binary
# encoding (third_party/6502-tests/VENDORED.md).
[[annotations]]
path = ["third_party/6502-tests/harte/*.bin"]
SPDX-FileCopyrightText = "Tom Harte and SingleStepTests' contributors"
SPDX-License-Identifier = "MIT"

# The README's screens montage: SIDOU's own LCD goldens (tests/golden/lcd/), scaled 2x and
# tiled by a script, so it is SIDOU's own output.
[[annotations]]
path = ["docs/media/*.png"]
SPDX-FileCopyrightText = "2026 SIDOU contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The how-to videos' font: Inter Tight, as the Inter Tight project releases it (LICENSING.md).
[[annotations]]
path = ["assets/fonts/InterTight-Variable.ttf"]
SPDX-FileCopyrightText = "2022 The Inter Project Authors (https://github.com/rsms/inter-tight)"
SPDX-License-Identifier = "OFL-1.1"

# The how-to videos' previews: rendered by tools/make-videos from SIDOU's own screens and
# sound in fm1-emu (docs/videos.md), and its per-video settings (JSON has no comments).
[[annotations]]
path = ["docs/media/videos/*.webp", "tools/videos/videos.json"]
SPDX-FileCopyrightText = "2026 SIDOU contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# floooh/chips' m6502.h, vendored unmodified for the PSID oracle, test-only
# (third_party/chips/VENDORED.md); its notice is in its header comment.
[[annotations]]
path = ["third_party/chips/m6502.h"]
SPDX-FileCopyrightText = "2018 Andre Weissflog"
SPDX-License-Identifier = "Zlib"

# FM-1 SID's PSID player, vendored unmodified for the PSID oracle, test-only
# (third_party/fm1-sid-player/VENDORED.md): each file carries its SPDX-License-Identifier;
# the copyright line is fm1-emu's LICENSE's.
[[annotations]]
path = ["third_party/fm1-sid-player/psid.c", "third_party/fm1-sid-player/psid.h", "third_party/fm1-sid-player/psidlog.c"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Joakim Eriksson"
SPDX-License-Identifier = "BSD-2-Clause"
