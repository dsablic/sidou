[package]
name = "sidou-tests"
description = "Unit, golden and reSIDfp reference tests for the SIDOU core, unit tests for the app logic, and sidou-compare"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
png = "0.18"
residfp-sys = { path = "../residfp-sys" }
sidou-sys = { path = "../sidou-sys" }
sidou-tablegen = { path = "../sidou-tablegen" }

[dev-dependencies]
gt2-ref = { path = "../gt2-ref" }

[[bin]]
name = "sidou-compare"
path = "src/bin/sidou_compare.rs"

[[test]]
name = "unit"
path = "tests/unit/main.rs"

[[test]]
name = "app"
path = "tests/app/main.rs"
