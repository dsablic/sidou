[package]
name = "sidou-tests"
description = "Unit, golden and reSIDfp reference tests for the SIDOU core, unit tests for the app logic, and sidou-compare"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
gt2-ref = { path = "../gt2-ref" }
png = "0.18"
residfp-sys = { path = "../residfp-sys" }
sha2 = "0.10"
sidou-sys = { path = "../sidou-sys" }
sidou-tablegen = { path = "../sidou-tablegen" }

[dev-dependencies]
fm1-live-link = { path = "../live-link" }
sidou-sysex = { path = "../sidou-sysex" }
# The store's layout against the package's region descriptors (tests/app/store_layout.rs).
fm1-soc = { git = "https://github.com/joakimeriksson/fm1-emu", rev = "93cb7ee3f7008b27959ba73073b864e37efd7289" }
sidou-pack = { path = "../sidou-pack" }

[[bin]]
name = "sidou-compare"
path = "src/bin/sidou_compare.rs"

[[bin]]
name = "harte-subset"
path = "src/bin/harte_subset.rs"

[[test]]
name = "unit"
path = "tests/unit/main.rs"

[[test]]
name = "app"
path = "tests/app/main.rs"
