[package]
name = "psid-ref"
description = "Test-only oracle for SIDOU's PSID environment: m6502.h and FM-1 SID's psid.c, compared call by call with the expected differences"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Links m6502.h (zlib) and a derived copy of FM-1 SID's psid.c (BSD-2-Clause) with SIDOU's
# GPL-3.0-or-later code; never built into the firmware.
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
sidou-sys = { path = "../sidou-sys" }

[dev-dependencies]
gt2-ref = { path = "../gt2-ref" }
sha2 = "0.10"
sidou-tests = { path = "../sidou-tests" }

[build-dependencies]
cc = { version = "1", features = ["parallel"] }
