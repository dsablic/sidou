[package]
name = "sidou-pack"
description = "Packs the SIDOU firmware and its update loader into an FM-1 update package (.fwsc)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# A port of Felucca's GPL-3.0-only packer (src/lib.rs).
license = "GPL-3.0-only"
publish.workspace = true

[lints]
workspace = true

[dependencies]
sha2 = "0.10"

[build-dependencies]
cc = "1"

[dev-dependencies]
fm1-soc = { git = "https://github.com/joakimeriksson/fm1-emu", rev = "db8d472e62f35d18e392e3abc66474daed65ffe9" }
