[package]
name = "emu-gate"
description = "Emulator tests: the firmware's budgets, boot, audio, controls and views in fm1-emu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
sidou-sys = { path = "../sidou-sys" }

[dev-dependencies]
fm1-live-link = { path = "../live-link" }
fm1-core = { git = "https://github.com/joakimeriksson/fm1-emu", rev = "93cb7ee3f7008b27959ba73073b864e37efd7289" }
fm1-soc = { git = "https://github.com/joakimeriksson/fm1-emu", rev = "93cb7ee3f7008b27959ba73073b864e37efd7289" }
gt2-ref = { path = "../gt2-ref" }
object = { version = "0.36", default-features = false, features = ["read", "elf", "std"] }
png = "0.18"
residfp-sys = { path = "../residfp-sys" }
serde_json = "1"
sidou-sysex = { path = "../sidou-sysex" }
sidou-tests = { path = "../sidou-tests" }
sidou-tablegen = { path = "../sidou-tablegen" }
